<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- Your existing CSS -->
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
    
    <!-- Additional CSS can go here -->
    {% seo %}
    {% feed_meta %}
</head>
<body>
    <!-- Navigation Menu - Copy your existing navigation here -->
    <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about' | relative_url }}">About</a>
        <a href="{{ '/gallery' | relative_url }}">Gallery</a>
        <a href="{{ '/events' | relative_url }}">Events</a>
        <a href="{{ '/upload-system' | relative_url }}">Upload System</a>
        <a href="{{ '/mahafil' | relative_url }}">Mahafil</a>
        <a href="{{ '/easy-upload' | relative_url }}">Easy Upload</a>
        <a href="{{ '/run-upload' | relative_url }}">Run Upload</a>
    </nav>

    <!-- Main Content Area -->
    <main>
        {{ content }}
    </main>

    <!-- Footer - Copy your existing footer here -->
    <footer>
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    </footer>

    <!-- Your existing JavaScript -->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
